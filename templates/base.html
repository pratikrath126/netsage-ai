<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetSage AI — Network Troubleshooter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="brand">NetSage AI</a>
            <div class="nav-links">
                <a href="/" class="{{ 'active' if request.path == '/' else '' }}">Dashboard</a>
                <a href="/cases" class="{{ 'active' if request.path == '/cases' else '' }}">Cases</a>
                <a href="/diagnose" class="{{ 'active' if request.path.startswith('/diagnose') else '' }}">Diagnose</a>
                <a href="/review" class="{{ 'active' if request.path == '/review' else '' }}">Review</a>
                <a href="/responsible-ai" class="{{ 'active' if request.path == '/responsible-ai' else '' }}">Responsible AI</a>
            </div>
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
